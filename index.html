
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>もくもく予定表</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>📅 もくもく予定表</h1>
    </header>

    <main>
        <div class="toolbar">
            <button id="prevMonth">←</button>
            <h2 id="currentMonth">2026年9月</h2>
            <button id="nextMonth">→</button>
        </div>

<div class="filters">
    <label>表示する人：</label>

    <div class="person-filter-dropdown" id="personFilterDropdown">
        <button
            type="button"
            id="personFilterButton"
            aria-expanded="false"
            aria-controls="personFilterMenu"
        >
            全員 ▼
        </button>

        <div
            id="personFilterMenu"
            class="person-filter-menu"
            style="display: none;"
        ></div>
    </div>

    <button id="addPersonButton">＋ 人を追加</button>
    <button id="managePeopleButton">👤 メンバー管理</button>
</div>
        
<!-- 予定の表示フィルター -->
<div class="view-switch" id="eventFilter">
    <button type="button" id="showAllEventsButton">
        すべての予定
    </button>
    <button type="button" id="showPerformancesOnlyButton">
        🎭 公演のみ
    </button>
</div>



        <div class="view-switch">
            <button id="calendarViewButton">📅 カレンダー</button>
            <button id="listViewButton">📋 一覧</button>
            <button id="availabilityViewButton">👥 空き状況</button>
        </div>

       <!-- 予定追加ボタン -->
<div style="display: flex; gap: 10px; width: 100%; margin-bottom: 15px;">

    <button
        type="button"
        id="addEventButton"
        class="add-event-button"
        style="flex: 1; min-width: 0; height: 48px; padding: 8px 4px; box-sizing: border-box; background-color: #222222; color: #ffffff; border: 1px solid #222222; border-radius: 8px; font-size: 15px; cursor: pointer;"
    >予定を追加</button>

    <button
        type="button"
        id="addPerformanceButton"
        style="flex: 1; min-width: 0; height: 48px; padding: 8px 4px; box-sizing: border-box; background-color: #8edcf5; color: #17212b; border: 1px solid #8edcf5; border-radius: 8px; font-size: 15px; cursor: pointer;"
    >公演を追加</button>

    <button
        type="button"
        id="addPersonalScheduleButton"
        style="flex: 1; min-width: 0; height: 48px; padding: 8px 4px; box-sizing: border-box; background-color: #ffffff; color: #222222; border: 1px solid #bbbbbb; border-radius: 8px; font-size: 15px; cursor: pointer;"
    >個人予定を追加</button>

</div>

        <div id="calendar" class="calendar"></div>

        <div id="listView" class="list-view hidden"></div>

        <div id="availabilityView" style="display: none;">
            <h2>👥 空き状況</h2>
            <div id="availabilityPeopleFilter">
                <strong>表示する人：</strong>
            </div>
           <div id="availabilityStickyControls" style="margin: 10px 0;">
    <label>
        <input type="checkbox" id="availabilityStickyToggle" checked>
        日付とメンバー名を固定する
    </label>
</div>

<div id="availabilityTable"></div>
            
<button type="button" id="manageRecurringUnavailabilityButton">
    ⚙️ 定期不可予定を管理
</button>


<div id="recurringUnavailabilityModal" class="modal hidden">
    <div class="modal-content">
        <button
            type="button"
            id="closeRecurringUnavailabilityModal"
            class="close-button"
        >×</button>

        <h2>定期不可予定の管理</h2>

        <label for="recurringPerson">人</label>
        <select id="recurringPerson"></select>

        <h3>定期不可予定を登録</h3>
        <p>曜日と時間帯を複数選択して、まとめて登録できます。</p>

        <label>曜日（複数選択可）</label>
        <div id="recurringWeekdayOptions">
            <label><input type="checkbox" name="recurringWeekday" value="0"> 日曜日</label>
            <label><input type="checkbox" name="recurringWeekday" value="1"> 月曜日</label>
            <label><input type="checkbox" name="recurringWeekday" value="2"> 火曜日</label>
            <label><input type="checkbox" name="recurringWeekday" value="3"> 水曜日</label>
            <label><input type="checkbox" name="recurringWeekday" value="4"> 木曜日</label>
            <label><input type="checkbox" name="recurringWeekday" value="5"> 金曜日</label>
            <label><input type="checkbox" name="recurringWeekday" value="6"> 土曜日</label>
        </div>

        <label>時間帯（複数選択可）</label>
        <div id="recurringTimePeriodOptions">
            <label><input type="checkbox" name="recurringTimePeriod" value="daytime"> 昼（昼×）</label>
            <label><input type="checkbox" name="recurringTimePeriod" value="evening"> 夜（夜×）</label>
        </div>

        <button
            type="button"
            id="saveRecurringUnavailabilityButton"
        >選択した曜日・時間帯をまとめて登録</button>

        <h3>登録済みの定期不可予定</h3>

        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
            <button type="button" id="selectAllRecurringUnavailabilityButton">
                すべて選択
            </button>
            <button type="button" id="clearRecurringUnavailabilitySelectionButton">
                選択解除
            </button>
            <button type="button" id="deleteSelectedRecurringUnavailabilityButton">
                選択したルールを一括削除
            </button>
        </div>

        <div id="recurringUnavailabilityList"></div>
    </div>
</div>


        </div>

        <!-- 予定詳細 -->
        <div id="eventModal" class="modal hidden">
            <div class="modal-content">
                <button id="closeModal" class="close-button">×</button>

                <h2 id="modalTitle"></h2>
                <p id="modalDate"></p>
                <p id="modalTime"></p>

                <h3>参加者</h3>
                <ul id="modalPeople"></ul>

                <!-- 備考表示 -->
                <p id="modalNote" style="white-space: pre-wrap;"></p>

                <p id="modalNotice"></p>

                <div class="modal-actions">
                    <button id="editEventButton">✏️ 編集</button>
                    <button id="deleteEventButton">🗑️ 削除</button>
                </div>
            </div>
        </div>

        <!-- 個人予定追加 -->
        <div id="personalScheduleModal" class="modal hidden">
            <div class="modal-content">
                <button id="closePersonalScheduleModal" class="close-button">×</button>

                <h2>個人予定を追加</h2>

                <label>
                    人
                    <select id="personalSchedulePerson"></select>
                </label>

                <label>
                    時間の種類
                    <select id="personalScheduleTimeType">
                        <option value="time">🕐 時刻を指定</option>
                        <option value="morning">🌅 朝</option>
                        <option value="afternoon">☀️ 昼</option>
                        <option value="evening">🌆 夕方</option>
                        <option value="night">🌙 夜</option>
                        <option value="allday">📅 一日中</option>
                    </select>
                </label>

                <label id="personalScheduleTimeLabel">
                    時間
                    <input type="time" id="personalScheduleTime">
                </label>

                <label>日付</label>

                <div style="margin-bottom: 8px;">
                    <button type="button" id="selectAllPersonalScheduleDates">
                        全部選択
                    </button>
                    <button type="button" id="clearAllPersonalScheduleDates">
                        全部解除
                    </button>
                </div>

                <div
                    id="personalScheduleDates"
                    style="max-height:250px; overflow-y:auto; border:1px solid #ddd; padding:10px; border-radius:8px; margin-top:5px; margin-bottom:15px;"
                ></div>

                <button id="savePersonalScheduleButton" class="save-event-button">
                    個人予定をまとめて登録
                </button>
            </div>
        </div>

        <!-- 予定追加・編集 -->
        <div id="addEventModal" class="modal hidden">
            <div class="modal-content">
                <button id="closeAddEventModal" class="close-button">×</button>

                <h2>予定を追加</h2>

                <label>
                    日付
                    <input type="date" id="eventDate">
                </label>

                <label>
                    時間の種類
                    <select id="eventTimeType">
                        <option value="time">🕐 時刻を指定</option>
                        <option value="morning">🌅 朝</option>
                        <option value="afternoon">☀️ 昼</option>
                        <option value="evening">🌆 夕方</option>
                        <option value="night">🌙 夜</option>
                        <option value="allday">📅 一日中</option>
                    </select>
                </label>

                <label id="eventTimeLabel">
                    時間
                    <input type="time" id="eventTime">
                </label>

                <label>
                    予定名
                    <input
                        type="text"
                        id="eventTitle"
                        placeholder="例：マダミス『○○』"
                    >
                </label>

                <label>参加者</label>
                <div class="people-checkboxes"></div>

                <!-- 備考入力欄 -->
                <label for="eventNote">備考（任意）</label>
                <textarea
                    id="eventNote"
                    rows="4"
                    maxlength="2000"
                    placeholder="シナリオの注意事項、集合場所など"
                ></textarea>

                <button id="saveEventButton" class="save-event-button">
                    予定を登録
                </button>
            </div>
        </div>
        <!-- 公演追加・編集 -->
        <div id="performanceModal" class="modal hidden">
            <div class="modal-content">
                <button
                    type="button"
                    id="closePerformanceModal"
                    class="close-button"
                >×</button>

                <h2 id="performanceModalTitle">公演を追加</h2>

                <label>
                    公演日
                    <input type="date" id="performanceDate">
                </label>

                <label>
                    公演の種類
                    <select id="performanceType">
                        <option value="normal">通常公演</option>
                        <option value="sale">セール公演</option>
                    </select>
                </label>

                <label>
    作品
    <select id="performanceWork">
        <option value="">作品を選択</option>
    </select>
</label>

<button
    type="button"
    id="openPerformanceWorksButton"
>
    ⚙️ 作品を登録・編集
</button>

                <label>
                    時間の種類
                    <select id="performanceTimeType">
                        <option value="time">🕐 時刻を指定</option>
                        <option value="morning">🌅 朝</option>
                        <option value="afternoon">☀️ 昼</option>
                        <option value="evening">🌆 夕方</option>
                        <option value="night">🌙 夜</option>
                        <option value="allday">📅 一日中</option>
                    </select>
                </label>

                <label id="performanceTimeLabel">
                    時間
                    <input type="time" id="performanceTime">
                </label>

                <label>参加者</label>
                <div id="performancePeopleCheckboxes"></div>

                <label for="performanceNote">備考（任意）</label>
                <textarea
                    id="performanceNote"
                    rows="4"
                    maxlength="2000"
                    placeholder="公演に関するメモ"
                ></textarea>

                <button
                    type="button"
                    id="savePerformanceButton"
                    class="save-event-button"
                >公演を登録</button>
            </div>
        </div>

        <!-- 作品管理 -->
        <div id="performanceWorksModal" class="modal hidden">
            <div class="modal-content">
                <button
                    type="button"
                    id="closePerformanceWorksModal"
                    class="close-button"
                >×</button>

                <h2>作品管理</h2>

                <label for="newPerformanceWorkName">作品名</label>
                <input
                    type="text"
                    id="newPerformanceWorkName"
                    maxlength="200"
                    placeholder="作品名を入力"
                >

                <button
                    type="button"
                    id="addPerformanceWorkButton"
                >作品を追加</button>

                <div id="performanceWorksList"></div>
            </div>
        </div>
        
        <!-- メンバー管理 -->
        <div id="peopleModal" class="modal hidden">
            <div class="modal-content">
                <button id="closePeopleModal" class="close-button">×</button>

                <h2>👤 メンバー管理</h2>
                <div id="peopleManagementList"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
